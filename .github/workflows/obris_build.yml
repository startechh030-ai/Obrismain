# =============================================================================
# Obris Engine — Android CI Build
# Builds libobris_shared.so for arm64-v8a, armeabi-v7a, x86_64
# and packages the Android APK.
# =============================================================================
name: Obris Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      upload_apk:
        description: 'Upload APK artifact'
        default: true
        type: boolean

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Debug' }}
  NDK_VERSION: '27.0.12077973'

jobs:
  build-native:
    name: Build libobris_shared.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake curl unzip

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        id: cache-third-party
        with:
          path: |
            third_party/miniaudio
            third_party/filament
            third_party/libsodium
          key: ${{ runner.os }}-obris-thirdparty-${{ hashFiles('build_scripts/setup_deps.sh') }}

      - name: Setup third-party dependencies
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        run: bash build_scripts/setup_deps.sh

      - name: Verify third-party deps
        run: |
          echo "=== Third-party status ==="
          for dir in miniaudio filament libsodium; do
            so_count=$(find "third_party/$dir" -name '*.so' 2>/dev/null | wc -l)
            h_count=$(find "third_party/$dir" \( -name '*.h' -o -name '*.hpp' \) 2>/dev/null | wc -l)
            echo "  $dir: $so_count .so, $h_count headers"
          done

      - name: Configure CMake
        run: |
          cmake -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -G Ninja

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --target obris_shared --parallel $(nproc)

      - name: Collect .so artifact
        run: |
          mkdir -p artifacts/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libobris_shared.so artifacts/${{ matrix.abi }}/
          # Also collect third-party .so files needed at runtime
          for lib_dir in third_party/*/lib/${{ matrix.abi }}; do
            [ -d "$lib_dir" ] && cp "$lib_dir"/*.so artifacts/${{ matrix.abi }}/ 2>/dev/null || true
          done

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: obris-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/

  build-android-apk:
    name: Build Android APK
    needs: build-native
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.upload_apk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all .so artifacts
        uses: actions/download-artifact@v4
        with:
          path: android/app/src/main/jniLibs/

      - name: Restructure JNI libs
        run: |
          for dir in android/app/src/main/jniLibs/obris-*/; do
            abi=$(basename "$dir" | sed 's/obris-//')
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "$dir"/*.so "android/app/src/main/jniLibs/$abi/" 2>/dev/null || true
          done
          rm -rf android/app/src/main/jniLibs/obris-*/
          echo "JNI libs structure:"
          find android/app/src/main/jniLibs -type f 2>/dev/null || echo "(no libs)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          # Generate Gradle wrapper if it doesn't exist
          if [ ! -f "gradlew" ]; then
            if command -v gradle &>/dev/null; then
              gradle wrapper --gradle-version 8.5
            else
              # Download Gradle wrapper manually
              mkdir -p gradle/wrapper
              curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties" \
                -o gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
              # Create a simple gradlew script
              cat > gradlew << 'GRADLEW'
#!/usr/bin/env sh
# Gradle wrapper generated by obris CI
if [ -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
  exec java -Xmx1024m -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
else
  echo "Gradle wrapper JAR not found — using system gradle"
  exec gradle "$@"
fi
GRADLEW
              chmod +x gradlew
            fi
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 || {
            echo "Gradle build failed — trying with system gradle..."
            gradle assembleDebug --no-daemon 2>&1 || echo "APK build failed — check logs above"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obris-viewer-apk
          path: android/app/build/outputs/apk/debug/*.apk

  lint:
    name: Verify project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files exist
        run: |
          echo "=== Verifying obris project structure ==="
          errors=0
          for f in CMakeLists.txt src/obris.h src/renderer/renderer.cpp src/audio/audio_engine.cpp src/json/json_reader.cpp src/encryption/crypto.cpp src/platform/jni_bridge.cpp android/app/src/main/java/com/obris/ObrisActivity.kt android/app/src/main/AndroidManifest.xml build_scripts/setup_deps.sh; do
            if [ -f "$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f"; errors=$((errors+1)); fi
          done
          [ "$errors" -eq 0 ] && echo "✅ All files present!" || exit 1
