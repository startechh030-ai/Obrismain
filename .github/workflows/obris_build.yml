# =============================================================================
# Obris Engine — Android CI Build
# Builds libobris_shared.so for arm64-v8a, armeabi-v7a, x86_64
# and packages the Android APK.
# =============================================================================
name: Obris Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      upload_apk:
        description: 'Upload APK artifact'
        default: true
        type: boolean

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Debug' }}

jobs:
  build-native:
    name: Build libobris_shared.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          # GitHub runners have Android SDK at /usr/local/lib/android/sdk/
          # or sometimes $ANDROID_SDK_ROOT / $ANDROID_HOME
          if [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            # Fallback: download cmdline-tools (with retry)
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            for i in 1 2 3; do
              curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
                -o /tmp/cmdline-tools.zip && break
              sleep 2
            done
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Find sdkmanager
          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found, checking pre-installed tools..."
          fi

          # Accept licenses if sdkmanager available
          if [ -n "${SDKMANAGER:-}" ]; then
            yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          fi

          # Check if NDK 27 is already installed
          NDK_PATH=""
          for candidate in "$ANDROID_SDK_ROOT/ndk/27.0.12077973" "$ANDROID_SDK_ROOT/ndk/27" "$ANDROID_SDK_ROOT/ndk-bundle"; do
            if [ -f "$candidate/build/cmake/android.toolchain.cmake" ]; then
              NDK_PATH="$candidate"
              echo "Found NDK at $NDK_PATH"
              break
            fi
          done

          # If NDK not found, install it
          if [ -z "$NDK_PATH" ]; then
            echo "NDK 27 not found. Installing..."
            if [ -n "${SDKMANAGER:-}" ]; then
              $SDKMANAGER "ndk;27.0.12077973" > /dev/null 2>&1
              NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
            else
              echo "ERROR: No sdkmanager and no pre-installed NDK found!"
              exit 1
            fi
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

          # Ensure Ninja is available for CMake
          if ! command -v ninja &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build 2>/dev/null || true
          fi

          # Add CMake to path if needed
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> $GITHUB_PATH 2>/dev/null || true

      - name: Verify tools
        run: |
          echo "=== Tool versions ==="
          ninja --version
          cmake --version | head -1
          echo "NDK: $ANDROID_NDK"
          ls -la "$ANDROID_NDK/build/cmake/android.toolchain.cmake" || echo "Toolchain MISSING!"
          echo "Ninja at: $(which ninja)"

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        id: cache-third-party
        with:
          path: |
            third_party/miniaudio
            third_party/filament
            third_party/libsodium
          key: ${{ runner.os }}-obris-thirdparty-v4-${{ hashFiles('build_scripts/setup_deps.sh') }}

      - name: Setup third-party dependencies
        if: ${{ steps.cache-third-party.outputs.cache-hit != 'true' }}
        run: bash build_scripts/setup_deps.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify third-party deps
        run: |
          echo "=== Third-party status ==="
          for dir in miniaudio filament libsodium; do
            so_count=$(find "third_party/$dir" -name '*.so' 2>/dev/null | wc -l)
            h_count=$(find "third_party/$dir" \( -name '*.h' -o -name '*.hpp' \) 2>/dev/null | wc -l)
            echo "  $dir: $so_count .so, $h_count headers"
          done

          # Ensure all critical headers exist even on cache hit (cache may be stale)
          if [ -d "third_party/filament/include" ]; then
            CRITICAL_FILES="filament/Engine.h filament/Renderer.h filament/Scene.h filament/View.h filament/Camera.h filament/SwapChain.h filament/LightManager.h filament/Skybox.h filament/IndirectLight.h filament/Texture.h filament/Color.h filament/TransformManager.h filament/RenderableManager.h filament/Options.h filament/Box.h filament/Viewport.h filament/Frustum.h backend/BufferDescriptor.h utils/bitset.h filament/MaterialEnums.h tsl/robin_map.h"
            MISSING=""
            for f in $CRITICAL_FILES; do
              if [ ! -f "third_party/filament/include/$f" ]; then
                MISSING="$MISSING $f"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "Missing critical headers:$MISSING — re-running setup..."
              bash build_scripts/setup_deps.sh
            fi
          fi

      - name: Configure CMake
        run: |
          cmake -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -G Ninja

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --target obris_shared --parallel $(nproc)

      - name: Collect .so artifact
        run: |
          mkdir -p artifacts/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libobris_shared.so artifacts/${{ matrix.abi }}/
          # Also collect third-party .so files needed at runtime
          for lib_dir in third_party/*/lib/${{ matrix.abi }}; do
            [ -d "$lib_dir" ] && cp "$lib_dir"/*.so artifacts/${{ matrix.abi }}/ 2>/dev/null || true
          done

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: obris-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/

  build-android-apk:
    name: Build Android APK
    needs: build-native
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.upload_apk == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (for APK build)
        run: |
          # Find pre-installed SDK
          if [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            for i in 1 2 3; do
              curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
                -o /tmp/cmdline-tools.zip && break
              sleep 2
            done
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Download all .so artifacts
        uses: actions/download-artifact@v4
        with:
          path: android/app/src/main/jniLibs/

      - name: Restructure JNI libs
        run: |
          for dir in android/app/src/main/jniLibs/obris-*/; do
            [ ! -d "$dir" ] && continue
            abi=$(basename "$dir" | sed 's/obris-//')
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "$dir"/*.so "android/app/src/main/jniLibs/$abi/" 2>/dev/null || true
          done
          rm -rf android/app/src/main/jniLibs/obris-*/
          echo "JNI libs structure:"
          find android/app/src/main/jniLibs -type f 2>/dev/null || echo "(no libs)"

      - name: Build APK
        run: |
          cd android
          # Generate local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Gradle wrapper
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 2>/dev/null || true
          fi
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --continue 2>&1
          else
            gradle assembleDebug --no-daemon --continue 2>&1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obris-viewer-apk
          path: android/app/build/outputs/apk/debug/*.apk

  lint:
    name: Verify project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files exist
        run: |
          echo "=== Verifying obris project structure ==="
          errors=0
          for f in CMakeLists.txt src/obris.h src/renderer/renderer.cpp src/audio/audio_engine.cpp src/json/json_reader.cpp src/encryption/crypto.cpp src/platform/jni_bridge.cpp android/app/src/main/java/com/obris/ObrisActivity.kt android/app/src/main/AndroidManifest.xml build_scripts/setup_deps.sh; do
            if [ -f "$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f"; errors=$((errors+1)); fi
          done
          [ "$errors" -eq 0 ] && echo "✅ All files present!" || exit 1
